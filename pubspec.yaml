name: levelex
description: "Levelex: your on-device workout coach. Camera rep counting, live form correction, levels and reminders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Camera + on-device pose detection (Google ML Kit)
  camera: ^0.12.1
  google_mlkit_pose_detection: ^0.16.1

  # On-device face verification: ML Kit face detection + MobileFaceNet (TFLite)
  google_mlkit_face_detection: ^0.15.1
  tflite_flutter: ^0.12.1

  # Local notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

  # Local persistence
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  shared_preferences: ^2.5.6

  # Platform
  # 13.x needs compileSdk 37, which this Flutter/AGP template cannot build yet.
  permission_handler: ^12.0.3
  sensors_plus: ^7.1.1
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.2
  wakelock_plus: ^1.8.0

  # UI / utilities
  fl_chart: ^1.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_animate: ^4.5.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  google_mlkit_image_labeling: ^0.16.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/models/
    - assets/icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#07090E"
  image: "assets/icon/splash.png"
  android_12:
    color: "#07090E"
    image: "assets/icon/splash.png"
    icon_background_color: "#07090E"
  ios: true
  android: true
  web: false
